name: ABI check
description: >-
  Compares the exported symbols of the given shared libraries against the
  checked-in ABI baselines.

inputs:
  project:
    description: >-
      Name of the checked project, used as the heading of the report.
    required: true
  binary:
    description: >-
      Whitespace separated list of the shared libraries to check.
    required: true
  output-dir:
    description: >-
      Directory to write the artifacts to.
    required: false
    default: abi-artifacts
  baseline-dir:
    description: >-
      Directory holding the ABI baselines of the project.
    required: true

runs:
  using: composite
  steps:
    - name: Install ABI tooling
      shell: bash
      run: |
        set -e -o pipefail

        venv_dir=abi-check

        if [ "${RUNNER_OS}" = "Windows" ]; then
          system_python=python
          venv_python="${venv_dir}/Scripts/python.exe"
        else
          system_python=python3
          venv_python="${venv_dir}/bin/python"
        fi

        if [ ! -x "${venv_python}" ]; then
          "${system_python}" -m venv "${venv_dir}"
          "${venv_python}" -m pip install --upgrade pip
          "${venv_python}" -m pip install -r "${GITHUB_ACTION_PATH}/requirements.txt"
        fi

        echo "ABI_PYTHON=${venv_python}" >> "${GITHUB_ENV}"

    - name: Check ABI
      shell: bash
      run: |
        set -e -o pipefail

        args=(
          --project "${{ inputs.project }}"
          --baseline-dir "${{ inputs.baseline-dir }}"
          --output-dir "${{ inputs.output-dir }}"
        )

        for binary in ${{ inputs.binary }}; do
          args+=(--binary "${binary}")
        done

        "${ABI_PYTHON}" "${GITHUB_ACTION_PATH}/compare_symbols.py" "${args[@]}"
